## Visual behavior belongs here. Generated palette bindings are imported below.
source = ~/.config/hypr/generated/theme.conf

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 1
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 30
        render_power = 3
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.12
    }
}

animations {
    enabled = true
    bezier = soft, 0.2, 0.9, 0.2, 1.0
    animation = windows, 1, 5, soft
    animation = border, 1, 4, soft
    animation = fade, 1, 3, linear
}
dwindle {
    preserve_split = true
    special_scale_factor = 0.9
}
general {
    layout = master
}

master {
    mfact = 0.65
    new_status = master
}
